<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP Server Practice</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .info { background: #f0f0f0; padding: 16px; border-radius: 8px; }
        code { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>TCP Server Practice</h1>
    <div class="info">
        <p>이 프로젝트는 Node.js <code>net</code> 모듈을 이용한 TCP 서버/클라이언트 실습입니다.</p>
        <h3>실행 방법</h3>
        <ul>
            <li>서버 실행: <code>node src/tcp_server.js</code></li>
            <li>클라이언트 실행: <code>node src/tcp_client.js</code></li>
            <li>telnet 테스트: <code>telnet 127.0.0.1 8080</code></li>
        </ul>
    </div>
</body>
</html>
